training_data_paths:
- "/data/cuizhengliang/dataset/chronos_datasets/training_corpus/kernel_synth_1m.arrow"
- "/data/cuizhengliang/dataset/chronos_datasets/training_corpus/tsmixup_10m.arrow"
probability:
- 0.9
- 0.1
context_length: 512
prediction_length: 64
min_past: 60
max_steps: 200_000
save_steps: 100_000
log_steps: 500
per_device_train_batch_size: 16
optim: adamw_torch_fused
num_samples: 20
shuffle_buffer_length: 100_000
gradient_accumulation_steps: 1
model_id: google/t5-v1_1-base
model_type: seq2seq
random_init: true
tie_embeddings: true
output_dir: ./output/
tf32: true
torch_compile: true
tokenizer_class: "MeanScaleUniformBins"
tokenizer_kwargs:
  low_limit: -15.0
  high_limit: 15.0
n_tokens: 4096

# Learning Rate
learning_rate: 0.0005  # 5.0 × 10^-4 as specified

# WSD (Warmup-Stable-Decay) scheduler configuration
# Use the official transformers WSD scheduler
lr_scheduler_type: warmup_stable_decay
warmup_ratio: 0.01  # 2000 steps / 200000 total steps = 0.01
warmup_steps: 2000  # 2000 steps warmup as specified
decay_steps: 20000  # 10% of 200k steps for decay phase
min_lr_ratio: 0.0   # Final learning rate = 0.0 * peak_lr = 0

# Other parameters
dataloader_num_workers: 2
max_missing_prop: 0.9
use_eos_token: true
